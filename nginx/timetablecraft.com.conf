# Host reverse proxy for https://timetablecraft.com
# Point this server block at the TimetableCraft-WEB container (default :10009).
# Install on the NAS / edge nginx, then issue TLS (Let's Encrypt / ASUSTOR UI).

upstream timetablecraft_web {
  server 127.0.0.1:10009;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name timetablecraft.com www.timetablecraft.com;
  return 301 https://timetablecraft.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.timetablecraft.com;
  # ssl_certificate     /path/to/fullchain.pem;
  # ssl_certificate_key /path/to/privkey.pem;
  return 301 https://timetablecraft.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name timetablecraft.com;

  # ssl_certificate     /path/to/fullchain.pem;
  # ssl_certificate_key /path/to/privkey.pem;

  client_max_body_size 20m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://timetablecraft_web;
  }
}
