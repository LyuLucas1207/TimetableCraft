server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;

  location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /sitemap.xml {
    try_files $uri =404;
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /site.webmanifest {
    try_files $uri =404;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400";
  }

  location ~* ^/(favicon\.ico|apple-touch-icon\.png|og\.png)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Normalize document URLs; $request_uri avoids redirecting internal index lookups.
  if ($request_uri ~ "^(.+)/index\.html(?:\?.*)?$") {
    return 301 $1$is_args$args;
  }
  if ($request_uri ~ "^/index\.html(?:\?.*)?$") {
    return 301 /$is_args$args;
  }
  if ($request_uri ~ "^(/[^?]*?)/+(?:\?.*)?$") {
    return 301 $1$is_args$args;
  }

  location = /app { return 301 /tools/schedule-maker$is_args$args; }
  location ~ ^/(about|features|privacy)$ { return 301 /contact$is_args$args; }

  error_page 404 /404.html;
  location = /404 { return 404; }
  location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex" always;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;
}
