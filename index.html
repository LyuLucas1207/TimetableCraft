<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Timetable Craft turns your Workday course Excel into a beautiful weekly timetable. Parsed locally in your browser — nothing is uploaded."
    />
    <meta name="theme-color" content="#0f2744" />
    <title>Timetable Craft — Workday Excel to Timetable</title>
    <meta property="og:site_name" content="Timetable Craft" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("timetablecraft:theme") || localStorage.getItem("ubcexceltoschedule:theme") || "light";
          var theme =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored;
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
