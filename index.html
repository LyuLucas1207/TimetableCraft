<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Timetable Craft" />
    <meta name="theme-color" content="#0f2744" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("timetablecraft:theme") || localStorage.getItem("ubcexceltoschedule:theme") || "light";
          var theme =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored;
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Free timetable maker – class, weekly, study, exam and work schedules</h1>
      <p>
        TimetableCraft is a free online timetable maker. Make a class timetable, weekly schedule, study timetable, exam timetable, work schedule,
        daily planner or routine, then export a PNG or calendar .ics. Enable JavaScript to use the tools:
      </p>
      <ul>
        <li><a href="/tools/schedule-maker">Class timetable maker</a></li>
        <li><a href="/tools/weekly-schedule">Weekly timetable maker</a></li>
        <li><a href="/tools/study-planner">Study timetable maker</a></li>
        <li><a href="/tools/exam-timetable">Exam timetable maker</a></li>
        <li><a href="/tools/work-schedule">Work schedule maker</a></li>
        <li><a href="/tools/daily-planner">Daily timetable maker</a></li>
        <li><a href="/tools/routine-planner">Routine timetable maker</a></li>
        <li><a href="/tools/custom-timetable">Custom timetable maker</a></li>
        <li><a href="/ubc-timetable-maker">UBC timetable maker</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
