<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Timetable Craft" />
    <meta name="theme-color" content="#0f2744" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("timetablecraft:theme") || localStorage.getItem("ubcexceltoschedule:theme") || "light";
          var theme =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored;
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Free timetable maker and schedule maker</h1>
      <p>
        Timetable Craft is a free course table maker. Add classes or import UBC Workday Excel, then export a weekly PNG or calendar .ics.
        Enable JavaScript to use the app, or open
        <a href="/tools/schedule-maker">Schedule Maker</a>
        and
        <a href="/ubc-timetable-maker">UBC timetable maker</a>
        after JavaScript is on.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
